<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel - JabbaTube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0;">
    <div style="padding: 10px 15px; background: #222; display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html"><img src="yt.png" width="120" style="object-fit: contain;"></a>
        <span id="userStatus" style="color: white; font-size: 14px;"></span>
    </div>

    <div style="max-width: 900px; margin: 20px auto; padding: 0 15px; box-sizing: border-box;">
        <h2 id="channelTitle">Channel</h2>
        <hr style="margin: 15px 0;">
        <h3>Uploaded Videos</h3>
        <div id="channel-videos" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;"></div>
    </div>

    <script>
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            document.getElementById('userStatus').innerHTML = `User: <a href="channel.html?name=${currentUser}" style="color: white; text-decoration: underline;">${currentUser}</a>`;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const channelName = urlParams.get('name');

        if (channelName) {
            document.getElementById('channelTitle').textContent = `${channelName}'s Channel`;

            fetch('/api/videos')
                .then(res => res.json())
                .then(videos => {
                    const grid = document.getElementById('channel-videos');
                    const userVideos = videos.filter(v => v.uploader === channelName);
                    
                    if (userVideos.length === 0) {
                        grid.innerHTML = '<p>No videos uploaded by this user yet.</p>';
                        return;
                    }

                    userVideos.forEach(video => {
                        const card = document.createElement('div');
                        card.style.width = '100%';
                        card.style.maxWidth = '280px';
                        card.innerHTML = `
                            <a href="view.html?id=${video.id}">
                                <img src="${video.thumbnailUrl}" width="100%" height="160" style="object-fit: cover; border-radius: 6px;">
                            </a>
                            <h3 style="font-size: 15px; margin: 8px 0 4px 0;">${video.title}</h3>
                        `;
                        grid.appendChild(card);
                    });
                });
        }
    </script>
</body>
</html>
