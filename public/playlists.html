<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - JabbaTube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0;">
    <div style="display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px 15px; flex-wrap: wrap; gap: 10px;">
        <a href="index.html"><img src="yt.png" width="120" style="object-fit: contain;"></a>
        <span id="userStatus" style="color: white; font-size: 14px;"></span>
    </div>

    <div style="max-width: 800px; margin: 20px auto; padding: 0 15px; box-sizing: border-box;">
        <h2>Playlists</h2>
        
        <div style="background: #f9f9f9; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #ddd;">
            <h3>Create a New Playlist</h3>
            <form id="createPlaylistForm" style="display: flex; gap: 8px; flex-wrap: wrap;">
                <input type="text" id="playlistName" placeholder="Playlist Name..." required style="padding: 8px; flex: 1; min-width: 200px; box-sizing: border-box;">
                <button type="submit" style="padding: 8px 15px; cursor: pointer;">Create</button>
            </form>
        </div>

        <div id="playlistsContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>

        <div id="singlePlaylistView" style="display: none;">
            <button onclick="backToList()" style="margin-bottom: 15px; cursor: pointer; padding: 6px 12px;">← Back to Playlists</button>
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <div>
                    <h2 id="playlistTitle" style="margin: 0;"></h2>
                    <p style="margin: 5px 0; color: gray; font-size: 14px;">Created by: <span id="playlistCreator"></span></p>
                </div>
                <button id="playAllBtn" style="padding: 10px 20px; background: #cc0000; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">▶ Play All</button>
            </div>
            <hr style="margin: 15px 0;">
            <div id="playlistVideos" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
    </div>

    <script>
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            alert('Please login first!');
            window.location.href = 'login.html';
        }
        document.getElementById('userStatus').innerHTML = `User: <strong>${currentUser}</strong>`;

        const urlParams = new URLSearchParams(window.location.search);
        const playlistId = urlParams.get('id');

        if (playlistId) {
            loadSinglePlaylist(playlistId);
        } else {
            loadAllPlaylists();
        }

        document.getElementById('createPlaylistForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('playlistName').value;

            fetch('/api/playlists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, username: currentUser })
            })
            .then(res => res.json())
            .then(() => {
                document.getElementById('playlistName').value = '';
                loadAllPlaylists();
            });
        });

        function loadAllPlaylists() {
            fetch('/api/playlists')
                .then(res => res.json())
                .then(playlists => {
                    const container = document.getElementById('playlistsContainer');
                    container.innerHTML = '';
                    if (playlists.length === 0) {
                        container.innerHTML = '<p>No playlists found.</p>';
                        return;
                    }
                    playlists.forEach(p => {
                        const div = document.createElement('div');
                        div.style.background = '#f4f4f4';
                        div.style.padding = '12px';
                        div.style.borderRadius = '6px';
                        div.innerHTML = `
                            <h3 style="margin: 0 0 5px 0;"><a href="playlists.html?id=${p.id}" style="color: #000; text-decoration: none;">${p.name}</a></h3>
                            <p style="margin: 0; font-size: 13px; color: gray;">Creator: ${p.creator} | Videos: ${p.videoIds.length}</p>
                        `;
                        container.appendChild(div);
                    });
                });
        }

        function loadSinglePlaylist(id) {
            document.getElementById('createPlaylistForm').parentElement.style.display = 'none';
            document.getElementById('playlistsContainer').style.display = 'none';
            document.getElementById('singlePlaylistView').style.display = 'block';

            fetch(`/api/playlists/${id}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('playlistTitle').textContent = data.name;
                    document.getElementById('playlistCreator').textContent = data.creator;
                    
                    const container = document.getElementById('playlistVideos');
                    container.innerHTML = '';
                    if (data.videos.length === 0) {
                        container.innerHTML = '<p>This playlist is empty.</p>';
                        document.getElementById('playAllBtn').style.display = 'none';
                        return;
                    }

                    document.getElementById('playAllBtn').onclick = function() {
                        const firstVideo = data.videos[0];
                        window.location.href = `view.html?id=${firstVideo.id}&playlistId=${id}&index=0`;
                    };

                    data.videos.forEach((v, index) => {
                        const item = document.createElement('div');
                        item.style.display = 'flex';
                        item.style.gap = '12px';
                        item.style.alignItems = 'center';
                        item.style.background = '#f9f9f9';
                        item.style.padding = '10px';
                        item.style.borderRadius = '4px';
                        item.innerHTML = `
                            <span style="font-weight: bold;">#${index + 1}</span>
                            <a href="view.html?id=${v.id}&playlistId=${id}&index=${index}"><img src="${v.thumbnailUrl}" width="100" height="60" style="object-fit: cover; border-radius: 4px;"></a>
                            <div style="flex: 1; overflow: hidden;">
                                <a href="view.html?id=${v.id}&playlistId=${id}&index=${index}" style="text-decoration: none; color: black; font-weight: bold; font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${v.title}</a>
                                <p style="margin: 4px 0 0 0; font-size: 12px; color: gray;">By ${v.uploader}</p>
                            </div>
                        `;
                        container.appendChild(item);
                    });
                });
        }

        function backToList() {
            window.location.href = 'playlists.html';
        }
    </script>
</body>
</html>
