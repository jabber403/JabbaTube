<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video - JabbaTube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0;">
    <div style="padding: 10px 15px; background: #222; display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html"><img src="yt.png" width="120" style="object-fit: contain;"></a>
        <span id="userStatus" style="color: white; font-size: 14px;"></span>
    </div>

    <div style="max-width: 500px; margin: 30px auto; padding: 20px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box;">
        <h2>Upload a Video</h2>
        <form id="uploadForm" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Video Title</label>
                <input type="text" id="titleInput" placeholder="Title" required style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Video File (URL or link)</label>
                <input type="text" id="videoUrlInput" placeholder="Video URL or Path" required style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Thumbnail Image URL</label>
                <input type="text" id="thumbnailUrlInput" placeholder="Thumbnail URL" required style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <button type="submit" style="width: 100%; padding: 12px; background: #cc0000; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px;">Upload</button>
        </form>
    </div>

    <script>
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            alert('Please login first to upload videos!');
            window.location.href = 'login.html';
        }
        document.getElementById('userStatus').innerHTML = `User: <strong>${currentUser}</strong>`;

        document.getElementById('uploadForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('titleInput').value;
            const videoUrl = document.getElementById('videoUrlInput').value;
            const thumbnailUrl = document.getElementById('thumbnailUrlInput').value;

            fetch('/api/videos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, videoUrl, thumbnailUrl, uploader: currentUser })
            })
            .then(res => res.json())
            .then(() => {
                alert('Video uploaded successfully!');
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
