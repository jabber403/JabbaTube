<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Watch Video</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="padding: 10px 20px; background: #222; display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" onclick="triggerMiniPlayer()"><img class="yt" src="yt.png" width="150" height="70"></a>
        <div>
            <a href="playlists.html" style="color: white; margin-right: 20px; text-decoration: underline;">Playlists</a>
            <span id="userStatus" style="color: white;"></span>
        </div>
    </div>

    <div style="display: flex; padding: 20px; gap: 30px; flex-wrap: wrap;">
        <!-- Left Column: Video, Details, Likes, Comments -->
        <div style="flex: 2; min-width: 400px;">
            <video id="videoPlayer" class="Video" controls autoplay width="100%" height="450"></video>
            <h1 id="videoTitle" class="Title" style="margin-top: 10px;">Loading...</h1>
            <p id="uploaderContainer" style="margin: 5px 0;"></p>
            
            <div style="margin: 15px 0; display: flex; gap: 10px; align-items: center;">
                <button id="likeBtn" style="padding: 8px 15px; cursor: pointer;">👍 <span id="likeCount">0</span></button>
                <button id="dislikeBtn" style="padding: 8px 15px; cursor: pointer;">👎 <span id="dislikeCount">0</span></button>
                
                <!-- Add to Playlist Selector -->
                <select id="playlistSelect" style="padding: 8px;">
                    <option value="">Add to Playlist...</option>
                </select>
                <button onclick="addToPlaylist()" style="padding: 8px 12px; cursor: pointer;">Add</button>
            </div>

            <hr style="margin: 20px 0;">

            <h3>Comments</h3>
            <form id="commentForm">
                <input type="text" id="commentInput" placeholder="Add a comment..." required style="padding: 8px; width: 70%;">
                <button type="submit" style="padding: 8px 15px;">Comment</button>
            </form>
            <div id="commentsList" style="margin-top: 15px;"></div>
        </div>

        <!-- Right Column: Sidebar Recommendations -->
        <div style="flex: 1; min-width: 280px;">
            <h3>Up Next</h3>
            <div id="sidebar-recommendations" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </div>
    </div>

    <script>
        const currentUser = localStorage.getItem('currentUser') || 'Guest';
        if (currentUser !== 'Guest') {
            document.getElementById('userStatus').innerHTML = `User: <a href="channel.html?name=${currentUser}" style="color: white; text-decoration: underline;">${currentUser}</a>`;
        } else {
            document.getElementById('userStatus').textContent = `User: Guest`;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');
        const playlistId = urlParams.get('playlistId');
        const videoIndex = parseInt(urlParams.get('index'));

        let currentVideoData = null;
        const videoPlayer = document.getElementById('videoPlayer');
        let nextVideoUrlToPlay = null; // Stores fallback Up Next video link

        if (videoId) {
            fetch(`/api/videos/${videoId}`)
                .then(res => res.json())
                .then(video => {
                    currentVideoData = video;
                    videoPlayer.src = video.videoUrl;
                    document.getElementById('videoTitle').textContent = video.title;
                    document.getElementById('likeCount').textContent = video.likes;
                    document.getElementById('dislikeCount').textContent = video.dislikes;
                    
                    const activeVideo = JSON.parse(localStorage.getItem('activeVideo'));
                    if (activeVideo && activeVideo.id == video.id) {
                        videoPlayer.currentTime = activeVideo.currentTime || 0;
                    }

                    // Force playback automatically
                    videoPlayer.play().catch(err => console.log("Autoplay blocked by browser policy:", err));

                    videoPlayer.addEventListener('timeupdate', () => {
                        localStorage.setItem('activeVideo', JSON.stringify({ 
                            id: video.id, 
                            title: video.title, 
                            url: video.videoUrl, 
                            currentTime: videoPlayer.currentTime 
                        }));
                    });

                    // Auto-advance logic (Playlist queue vs Regular Up Next queue)
                    videoPlayer.addEventListener('ended', () => {
                        if (playlistId && !isNaN(videoIndex)) {
                            fetch(`/api/playlists/${playlistId}`)
                                .then(res => res.json())
                                .then(playlist => {
                                    const nextIndex = videoIndex + 1;
                                    if (playlist.videoIds[nextIndex]) {
                                        const nextVideoId = playlist.videoIds[nextIndex];
                                        window.location.href = `view.html?id=${nextVideoId}&playlistId=${playlistId}&index=${nextIndex}`;
                                    }
                                });
                        } else if (nextVideoUrlToPlay) {
                            window.location.href = nextVideoUrlToPlay;
                        }
                    });

                    const uploaderElement = document.getElementById('uploaderContainer');
                    if (video.uploader === currentUser) {
                        uploaderElement.innerHTML = 'Uploaded by: <strong>You</strong>';
                    } else {
                        uploaderElement.innerHTML = `Uploaded by: <a href="channel.html?name=${video.uploader}">${video.uploader}</a>`;
                    }

                    renderComments(video.comments);
                });

            // Load user playlists for dropdown
            if (currentUser !== 'Guest') {
                fetch('/api/playlists')
                    .then(res => res.json())
                    .then(playlists => {
                        const select = document.getElementById('playlistSelect');
                        playlists.forEach(p => {
                            if (p.creator === currentUser) {
                                const opt = document.createElement('option');
                                opt.value = p.id;
                                opt.textContent = p.name;
                                select.appendChild(opt);
                            }
                        });
                    });
            }

            function sendVote(type) {
                if (currentUser === 'Guest') {
                    alert('Please login first to vote!');
                    window.location.href = 'login.html';
                    return;
                }

                fetch(`/api/videos/${videoId}/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser, type })
                })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('likeCount').textContent = data.likes;
                    document.getElementById('dislikeCount').textContent = data.dislikes;
                });
            }

            document.getElementById('likeBtn').addEventListener('click', () => sendVote('like'));
            document.getElementById('dislikeBtn').addEventListener('click', () => sendVote('dislike'));

            document.getElementById('commentForm').addEventListener('submit', (e) => {
                e.preventDefault();
                if (currentUser === 'Guest') {
                    alert('Please login to comment!');
                    window.location.href = 'login.html';
                    return;
                }

                const text = document.getElementById('commentInput').value;
                fetch(`/api/videos/${videoId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, username: currentUser })
                })
                .then(res => res.json())
                .then(comments => {
                    renderComments(comments);
                    document.getElementById('commentInput').value = '';
                });
            });
        }

        function addToPlaylist() {
            const selectedPlaylistId = document.getElementById('playlistSelect').value;
            if (!selectedPlaylistId) {
                alert('Please select a playlist.');
                return;
            }

            fetch(`/api/playlists/${selectedPlaylistId}/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ videoId })
            })
            .then(res => res.json())
            .then(() => alert('Added to playlist successfully!'));
        }

        function triggerMiniPlayer() {
            if (currentVideoData) {
                localStorage.setItem('activeVideo', JSON.stringify({ 
                    id: currentVideoData.id, 
                    title: currentVideoData.title, 
                    url: currentVideoData.videoUrl, 
                    currentTime: videoPlayer.currentTime 
                }));
            }
        }

        fetch('/api/videos')
            .then(res => res.json())
            .then(videos => {
                const sidebar = document.getElementById('sidebar-recommendations');
                let firstRecommendation = true;

                videos.forEach(video => {
                    if (video.id != videoId) {
                        const targetUrl = `view.html?id=${video.id}`;
                        // Capture the first recommended video as the default Up Next target
                        if (firstRecommendation && !playlistId) {
                            nextVideoUrlToPlay = targetUrl;
                            firstRecommendation = false;
                        }

                        const item = document.createElement('div');
                        item.style.display = 'flex';
                        item.style.gap = '10px';
                        item.innerHTML = `
                            <a href="${targetUrl}" onclick="triggerMiniPlayer()"><img src="${video.thumbnailUrl}" width="120" height="70" style="object-fit: cover;"></a>
                            <div><a href="${targetUrl}" onclick="triggerMiniPlayer()" style="text-decoration: none; color: black;"><h4 style="margin: 0; font-size: 14px;">${video.title}</h4></a></div>
                        `;
                        sidebar.appendChild(item);
                    }
                });
            });

        function renderComments(comments) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '';
            comments.forEach(c => {
                const authorDisplay = (c.username === currentUser) ? 'You' : `<a href="channel.html?name=${c.username}">${c.username}</a>`;
                const p = document.createElement('p');
                p.style.background = '#eee';
                p.style.padding = '8px';
                p.style.borderRadius = '4px';
                p.innerHTML = `<strong>${authorDisplay}</strong> <span style="font-size: 11px; color: gray;">${c.date}</span><br>${c.text}`;
                list.appendChild(p);
            });
        }
    </script>
</body>
</html>
