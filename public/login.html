<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - YouTube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="background: white; padding: 30px; border-radius: 8px; text-align: center; width: 300px;">
        <img src="yt.png" width="120" style="margin-bottom: 20px;">
        <h2>Sign In / Sign Up</h2>
        <input type="text" id="username" placeholder="Username" style="width: 90%; padding: 8px; margin-bottom: 10px;"><br>
        <input type="password" id="password" placeholder="Password" style="width: 90%; padding: 8px; margin-bottom: 15px;"><br>
        <button onclick="auth('login')" style="padding: 8px 15px; cursor: pointer;">Login</button>
        <button onclick="auth('signup')" style="padding: 8px 15px; cursor: pointer; margin-left: 5px;">Sign Up</button>
        <p id="errorMsg" style="color: red; font-size: 14px; margin-top: 10px;"></p>
    </div>

    <script>
        function auth(endpoint) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch(`/api/${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('currentUser', data.username);
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('errorMsg').textContent = data.error;
                }
            });
        }
    </script>
</body>
</html>
