<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup - JabbaTube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; box-sizing: border-box; margin: 20px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="index.html"><img src="yt.png" width="120" alt="Logo"></a>
            <h2>Login / Signup</h2>
        </div>

        <form id="loginForm">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">Username</label>
                <input type="text" id="usernameInput" placeholder="Enter your username" required style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 10px; background: #cc0000; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;">Continue</button>
        </form>
        
        <p id="errorMsg" style="color: red; text-align: center; margin-top: 15px; font-size: 14px;"></p>
    </div>

    <script>
        // Redirect if already logged in
        if (localStorage.getItem('currentUser')) {
            window.location.href = 'index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();

            if (!username) {
                document.getElementById('errorMsg').textContent = 'Please enter a valid username.';
                return;
            }

            // Save user to localStorage safely
            try {
                localStorage.setItem('currentUser', username);
                window.location.href = 'index.html';
            } catch (err) {
                document.getElementById('errorMsg').textContent = 'Storage blocked. Please check browser privacy settings.';
                console.log('localStorage error:', err);
            }
        });
    </script>
</body>
</html>
